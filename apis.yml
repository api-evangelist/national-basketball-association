aid: national-basketball-association
name: National Basketball Association
description: >-
  The National Basketball Association (NBA) is the premier men's professional
  basketball league in North America, comprised of 30 franchises (29 in the
  United States and 1 in Canada). The NBA does not operate a public developer
  portal; statistical, scoring, and play-by-play data feeds are licensed
  through official partners (notably Sportradar and Genius Sports). The
  stats.nba.com endpoints are not officially documented as a public API.
